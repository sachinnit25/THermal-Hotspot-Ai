<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THERMALGUARD AI — Industrial Fire & Thermal Anomaly Monitoring System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { background-color: #040814; color: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .starfield { position: fixed; inset: 0; background-image: radial-gradient(1.5px 1.5px at 20px 30px, #ffffff25, rgba(0,0,0,0)), radial-gradient(2px 2px at 150px 150px, #38bdf830, rgba(0,0,0,0)); background-size: 500px 500px; pointer-events: none; }
    .nebula { position: fixed; width: 650px; height: 650px; border-radius: 50%; filter: blur(130px); opacity: 0.16; pointer-events: none; }
    .nebula-rose { background: #f43f5e; top: -150px; left: -100px; }
    .nebula-cyan { background: #06b6d4; bottom: -150px; right: -100px; }
    .glass-panel { background: rgba(9, 18, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 35px 0 rgba(0, 0, 0, 0.45); }
    #leaflet-map { height: 100%; width: 100%; min-height: 480px; background: #050d1e; z-index: 1; }
    .leaflet-popup-content-wrapper { background: #091730; color: #f8fafc; border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 12px; }
    .leaflet-popup-tip { background: #091730; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #f43f5e; box-shadow: 0 0 10px #f43f5e; display: inline-block; animation: pulse-red 1.5s infinite; }
    @keyframes pulse-red { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="starfield"></div>
  <div class="nebula nebula-rose"></div>
  <div class="nebula nebula-cyan"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function LeafletMap({ hotspots, selectedHotspot, onSelectHotspot }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef([]);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [22.4700, 69.0700], // Centered near Gujarat industrial hub
            zoom: 6,
            zoomControl: true
          });

          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        markersRef.current.forEach(m => m.remove());
        markersRef.current = [];

        hotspots.forEach(h => {
          const lat = h.latitude;
          const lon = h.longitude;
          if (!lat || !lon) return;

          const isSelected = selectedHotspot && selectedHotspot.latitude === lat && selectedHotspot.longitude === lon;
          
          let color = '#06b6d4'; // Cyan default
          let iconChar = '🟠';
          if (h.predicted_category === 'Industrial Fire') {
            color = '#f43f5e'; iconChar = '🔴';
          } else if (h.predicted_category === 'Gas Flare') {
            color = '#f59e0b'; iconChar = '🔥';
          } else if (h.predicted_category === 'Agricultural Burning') {
            color = '#10b981'; iconChar = '🌾';
          } else if (h.predicted_category === 'Wildfire') {
            color = '#ef4444'; iconChar = '🌲';
          } else if (h.predicted_category === 'Mining Thermal Activity') {
            color = '#a855f7'; iconChar = '⛏️';
          }

          const customIcon = L.divIcon({
            className: 'custom-map-marker',
            html: `<div style="
              width: ${isSelected ? '26px' : '18px'};
              height: ${isSelected ? '26px' : '18px'};
              background-color: ${color};
              border: 2px solid ${isSelected ? '#ffffff' : 'rgba(255,255,255,0.6)'};
              border-radius: 50%;
              box-shadow: 0 0 ${isSelected ? '16px' : '8px'} ${color};
              display: flex; align-items: center; justify-content: center; font-size: ${isSelected ? '14px' : '10px'};
              transition: all 0.2s ease;
            ">${iconChar}</div>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });

          const marker = L.marker([lat, lon], { icon: customIcon }).addTo(map);

          marker.bindPopup(`
            <div style="font-family: system-ui; padding: 4px;">
              <div style="font-weight: 700; color: ${color}; font-size: 14px;">${iconChar} ${h.predicted_category}</div>
              <div style="font-size: 11px; color: #cbd5e1; margin-top: 3px;">Location: ${lat}°N, ${lon}°E</div>
              <div style="font-size: 11px; color: #cbd5e1;">Risk Score: <strong style="color:${color}">${h.risk_score || 85}/100</strong></div>
              <div style="font-size: 11px; color: #cbd5e1;">FRP: <strong>${h.frp} MW</strong></div>
              <div style="font-size: 11px; color: #38bdf8; margin-top: 4px;">Facility: ${h.nearest_facility_name || 'Industrial Zone'}</div>
              <button id="select-btn-${lat}-${lon}" style="
                margin-top: 8px; width: 100%; background: #f43f5e; color: #ffffff;
                border: none; border-radius: 6px; padding: 5px 8px; font-size: 11px;
                font-weight: 700; cursor: pointer; text-transform: uppercase; tracking: 0.05em;
              ">Select Incident</button>
            </div>
          `);

          marker.on('popupopen', () => {
            const btn = document.getElementById(`select-btn-${lat}-${lon}`);
            if (btn) btn.onclick = () => onSelectHotspot(h);
          });

          marker.on('click', () => onSelectHotspot(h));
          markersRef.current.push(marker);
        });

        if (selectedHotspot && selectedHotspot.latitude && selectedHotspot.longitude) {
          map.panTo([selectedHotspot.latitude, selectedHotspot.longitude], { animate: true });
        }

      }, [hotspots, selectedHotspot]);

      return <div id="leaflet-map" ref={mapContainerRef}></div>;
    }

    function App() {
      const [stats, setStats] = useState(null);
      const [hotspots, setHotspots] = useState([]);
      const [selectedHotspot, setSelectedHotspot] = useState(null);
      const [nationalRisk, setNationalRisk] = useState([]);
      const [categoryFilter, setCategoryFilter] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeTab, setActiveTab] = useState("gis"); // "gis", "national", "alerts"
      
      // Modals
      const [showSatModal, setShowSatModal] = useState(false);
      const [showTimelineModal, setShowTimelineModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [showAlertModal, setShowAlertModal] = useState(false);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [configData, setConfigData] = useState(null);

      const fetchData = async () => {
        try {
          const [statsRes, hotspotsRes, riskRes, configRes] = await Promise.all([
            fetch('/api/stats'),
            fetch('/api/hotspots'),
            fetch('/api/national-risk'),
            fetch('/api/config')
          ]);
          const statsData = await statsRes.json();
          const hotspotsData = await hotspotsRes.json();
          const riskData = await riskRes.json();
          const cfgData = await configRes.json();

          setStats(statsData);
          setHotspots(hotspotsData.hotspots || []);
          setNationalRisk(riskData.states || []);
          setConfigData(cfgData);
          if (hotspotsData.hotspots && hotspotsData.hotspots.length > 0 && !selectedHotspot) {
            setSelectedHotspot(hotspotsData.hotspots[0]);
          }
        } catch (err) {
          console.error("Error fetching ThermalGuard AI data:", err);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const filteredHotspots = useMemo(() => {
        return hotspots.filter(h => {
          const matchCat = categoryFilter === "All" || h.predicted_category === categoryFilter;
          const q = searchQuery.toLowerCase();
          const matchQ = !q || 
            String(h.latitude).includes(q) || 
            String(h.longitude).includes(q) || 
            (h.predicted_category && h.predicted_category.toLowerCase().includes(q)) ||
            (h.nearest_facility_name && h.nearest_facility_name.toLowerCase().includes(q));
          return matchCat && matchQ;
        });
      }, [hotspots, categoryFilter, searchQuery]);

      const getCategoryBadge = (category) => {
        switch (category) {
          case 'Industrial Fire': return 'text-rose-300 bg-rose-500/20 border-rose-500/40';
          case 'Gas Flare': return 'text-amber-300 bg-amber-500/20 border-amber-500/40';
          case 'Agricultural Burning': return 'text-emerald-300 bg-emerald-500/20 border-emerald-500/40';
          case 'Wildfire': return 'text-red-400 bg-red-500/20 border-red-500/40';
          case 'Mining Thermal Activity': return 'text-purple-300 bg-purple-500/20 border-purple-500/40';
          default: return 'text-slate-300 bg-slate-500/20 border-slate-500/40';
        }
      };

      const getCategoryIcon = (category) => {
        switch (category) {
          case 'Industrial Fire': return '🏭🔥';
          case 'Gas Flare': return '🔥';
          case 'Agricultural Burning': return '🌾';
          case 'Wildfire': return '🌲';
          case 'Mining Thermal Activity': return '⛏️';
          default: return '⚠️';
        }
      };

      return (
        <div className="relative z-10 mx-auto max-w-[1650px] px-4 py-6 sm:px-8">
          {/* Header Rebrand */}
          <header className="mb-6 flex flex-col gap-4 border-b border-white/10 pb-5 md:flex-row md:items-center md:justify-between">
            <div className="flex items-center gap-4">
              <div className="flex h-13 w-13 items-center justify-center rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-400 shadow-xl shadow-rose-500/10 p-3">
                <i data-lucide="flame" className="w-8 h-8"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="status-dot"></span>
                  <span className="text-[11px] font-bold tracking-[0.25em] text-rose-400 uppercase">SIH AI INTELLIGENCE PLATFORM</span>
                </div>
                <h1 className="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">THERMALGUARD AI</h1>
                <p className="text-xs text-slate-400 mt-0.5">AI-Powered Industrial Fire & Thermal Anomaly Monitoring System</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setActiveTab("gis")}
                className={`px-4 py-2 text-xs font-bold rounded-xl border transition-all ${activeTab === 'gis' ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow-lg shadow-cyan-500/20' : 'bg-white/[0.03] border-white/10 text-slate-400 hover:text-white'}`}>
                LIVE GIS MAP
              </button>
              <button 
                onClick={() => setActiveTab("national")}
                className={`px-4 py-2 text-xs font-bold rounded-xl border transition-all ${activeTab === 'national' ? 'bg-rose-500/20 border-rose-400 text-rose-300 shadow-lg shadow-rose-500/20' : 'bg-white/[0.03] border-white/10 text-slate-400 hover:text-white'}`}>
                NATIONAL RISK MAP
              </button>
              <button 
                onClick={() => setShowAlertModal(true)}
                className="px-4 py-2 text-xs font-bold rounded-xl border border-amber-500/40 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all flex items-center gap-2">
                <i data-lucide="bell" className="w-4 h-4"></i>
                TRIGGER ALERTS
              </button>
              <button 
                onClick={() => setShowConfigModal(true)}
                className="px-4 py-2 text-xs font-bold rounded-xl border border-cyan-500/40 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 transition-all flex items-center gap-2">
                <i data-lucide="settings" className="w-4 h-4"></i>
                API SETTINGS
              </button>
            </div>
          </header>

          {/* Top Metric Bar */}
          <section className="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div className="glass-panel rounded-2xl p-5 border-l-4 border-l-rose-500">
              <div className="flex items-center justify-between text-slate-400 text-xs font-bold uppercase tracking-wider">
                <span>🔴 ACTIVE ALERTS</span>
                <i data-lucide="shield-alert" className="w-5 h-5 text-rose-400"></i>
              </div>
              <p className="mt-2 text-3xl font-extrabold text-rose-400">{stats ? (stats.active_alerts || 7) : '7'}</p>
              <p className="mt-1 text-xs text-slate-400">Critical industrial threats</p>
            </div>

            <div className="glass-panel rounded-2xl p-5 border-l-4 border-l-amber-500">
              <div className="flex items-center justify-between text-slate-400 text-xs font-bold uppercase tracking-wider">
                <span>🟠 ANOMALIES</span>
                <i data-lucide="alert-triangle" className="w-5 h-5 text-amber-400"></i>
              </div>
              <p className="mt-2 text-3xl font-extrabold text-amber-300">{stats ? (stats.anomalies_count || 14) : '14'}</p>
              <p className="mt-1 text-xs text-slate-400">Elevated thermal activity</p>
            </div>

            <div className="glass-panel rounded-2xl p-5 border-l-4 border-l-cyan-500">
              <div className="flex items-center justify-between text-slate-400 text-xs font-bold uppercase tracking-wider">
                <span>🏭 INDUSTRIAL FIRES</span>
                <i data-lucide="factory" className="w-5 h-5 text-cyan-400"></i>
              </div>
              <p className="mt-2 text-3xl font-extrabold text-cyan-300">{stats ? (stats.industrial_fires_count || 3) : '3'}</p>
              <p className="mt-1 text-xs text-slate-400">Refinery/Chemical plant fires</p>
            </div>

            <div className="glass-panel rounded-2xl p-5 border-l-4 border-l-emerald-500">
              <div className="flex items-center justify-between text-slate-400 text-xs font-bold uppercase tracking-wider">
                <span>🟢 NORMAL SOURCES</span>
                <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>
              </div>
              <p className="mt-2 text-3xl font-extrabold text-emerald-300">{stats ? (stats.normal_sources_count || 28) : '28'}</p>
              <p className="mt-1 text-xs text-slate-400">Baseline persistent flare stack</p>
            </div>
          </section>

          {/* TAB 1: LIVE GIS MONITORING */}
          {activeTab === 'gis' && (
            <section className="grid gap-6 lg:grid-cols-[1.25fr_1fr]">
              {/* GIS Map & Signal Queue Column */}
              <div className="flex flex-col gap-6">
                {/* Live GIS Map */}
                <div className="glass-panel relative flex flex-col rounded-2xl overflow-hidden min-h-[520px]">
                  <div className="flex items-center justify-between border-b border-white/10 p-4">
                    <div className="flex items-center gap-2">
                      <i data-lucide="map-pin" className="w-5 h-5 text-cyan-400"></i>
                      <h2 className="font-bold text-white uppercase tracking-wider text-sm">LIVE GIS MAP (NASA FIRMS + OSM + SATELLITE TILE ENGINE)</h2>
                    </div>
                    <div className="text-xs text-slate-400 font-mono">MAP ENGINE: CARTO DARK MATTER</div>
                  </div>

                  <div className="relative flex-1 min-h-[450px] overflow-hidden">
                    <LeafletMap 
                      hotspots={filteredHotspots} 
                      selectedHotspot={selectedHotspot}
                      onSelectHotspot={setSelectedHotspot}
                    />

                    <div className="absolute bottom-4 left-4 z-[400] flex flex-wrap items-center gap-3 rounded-xl border border-white/10 bg-slate-950/90 px-3 py-2 text-xs backdrop-blur-md">
                      <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-rose-500 shadow-sm shadow-rose-500"></span>🔴 Industrial Fire</span>
                      <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500"></span>🔥 Gas Flare</span>
                      <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500"></span>🌾 Ag Burn</span>
                      <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-red-500 shadow-sm shadow-red-500"></span>🌲 Wildfire</span>
                    </div>
                  </div>
                </div>

                {/* Signal Queue */}
                <div className="glass-panel flex flex-col rounded-2xl max-h-[380px]">
                  <div className="border-b border-white/10 p-4">
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="font-bold text-white uppercase tracking-wider text-sm">Active Satellite Detections Queue ({filteredHotspots.length})</h2>
                      <span className="rounded-full bg-rose-500/10 border border-rose-500/30 px-3 py-0.5 text-xs text-rose-300 font-semibold">FIRMS VIIRS Feed</span>
                    </div>
                    <div className="flex flex-col gap-2 sm:flex-row">
                      <input 
                        type="text" 
                        placeholder="Search coords, location, or facility..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="flex-1 rounded-xl border border-white/10 bg-black/40 px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-400"
                      />
                      <select 
                        value={categoryFilter}
                        onChange={(e) => setCategoryFilter(e.target.value)}
                        className="rounded-xl border border-white/10 bg-[#081329] px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-rose-400">
                        <option value="All">All 6 AI Classes</option>
                        <option value="Industrial Fire">Industrial Fire 🏭🔥</option>
                        <option value="Gas Flare">Gas Flare 🔥</option>
                        <option value="Agricultural Burning">Agricultural Burning 🌾</option>
                        <option value="Wildfire">Wildfire 🌲</option>
                        <option value="Mining Thermal Activity">Mining Activity ⛏️</option>
                        <option value="Unknown / Anomalous">Unknown / Anomalous ⚠️</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto p-3 space-y-2">
                    {filteredHotspots.map((h, idx) => {
                      const isSelected = selectedHotspot && selectedHotspot.latitude === h.latitude && selectedHotspot.longitude === h.longitude;
                      const badgeStyle = getCategoryBadge(h.predicted_category);
                      const icon = getCategoryIcon(h.predicted_category);

                      return (
                        <div 
                          key={idx}
                          onClick={() => setSelectedHotspot(h)}
                          className={`cursor-pointer rounded-xl border p-3 transition-all ${isSelected ? 'border-rose-500/80 bg-rose-500/10 shadow-md shadow-rose-500/10' : 'border-white/5 bg-white/[0.02] hover:bg-white/[0.05]'}`}>
                          <div className="flex items-center justify-between">
                            <span className={`rounded-lg border px-2.5 py-0.5 text-xs font-bold ${badgeStyle}`}>
                              {icon} {h.predicted_category}
                            </span>
                            <span className="text-xs font-mono font-bold text-rose-400">Risk: {h.risk_score || 85}/100</span>
                          </div>

                          <div className="mt-2 flex items-center justify-between text-xs text-slate-300">
                            <span className="font-mono">{h.latitude}°N, {h.longitude}°E</span>
                            <span className="text-slate-400">FRP: <strong>{h.frp} MW</strong></span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* SELECTED INCIDENT PANEL */}
              {selectedHotspot ? (
                <aside className="glass-panel flex flex-col rounded-2xl p-6">
                  <div className="border-b border-white/10 pb-4">
                    <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-rose-400">SELECTED INCIDENT</div>
                    <h2 className="mt-1 text-2xl font-extrabold text-white flex items-center gap-2">
                      <span>{getCategoryIcon(selectedHotspot.predicted_category)}</span>
                      <span>{selectedHotspot.predicted_category}</span>
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">Location: <strong className="text-slate-200">{selectedHotspot.nearest_facility_name || 'Jamnagar, Gujarat'}</strong> ({selectedHotspot.latitude}°N, {selectedHotspot.longitude}°E)</p>
                  </div>

                  {/* Incident Specs */}
                  <div className="mt-4 grid grid-cols-2 gap-3">
                    <div className="rounded-xl border border-white/10 bg-white/[0.02] p-3">
                      <div className="text-[11px] text-slate-400">AI Confidence</div>
                      <div className="mt-1 text-lg font-bold text-cyan-300">{selectedHotspot.confidence_score}%</div>
                    </div>

                    <div className="rounded-xl border border-white/10 bg-white/[0.02] p-3">
                      <div className="text-[11px] text-slate-400">FRP Intensity</div>
                      <div className="mt-1 text-lg font-bold text-amber-300">{selectedHotspot.frp} MW</div>
                    </div>
                  </div>

                  {/* Risk Score Progress Bar */}
                  <div className="mt-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 p-4">
                    <div className="flex items-center justify-between text-xs font-bold">
                      <span className="text-rose-300 uppercase tracking-wider">AI Risk Score</span>
                      <span className="text-rose-400 text-base font-extrabold">🔴 {selectedHotspot.risk_score || 91}/100</span>
                    </div>
                    <div className="mt-2 h-2.5 w-full overflow-hidden rounded-full bg-slate-950">
                      <div className="h-full bg-gradient-to-r from-amber-500 to-rose-500 rounded-full" style={{ width: `${selectedHotspot.risk_score || 91}%` }}></div>
                    </div>
                    <div className="mt-2 text-[11px] text-rose-200/80">Tier: <strong className="uppercase">{selectedHotspot.risk_level || 'CRITICAL'}</strong> — Immediate intervention recommended.</div>
                  </div>

                  {/* OSM Nearby Distances */}
                  <div className="mt-5">
                    <div className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Nearby OpenStreetMap Infrastructure</div>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="rounded-xl border border-white/10 bg-white/[0.02] p-2.5">
                        <div className="text-lg mb-1">🏭</div>
                        <div className="text-[10px] text-slate-400">Refinery</div>
                        <div className="font-bold text-slate-200">{selectedHotspot.refinery_dist_km || 0.8} km</div>
                      </div>
                      <div className="rounded-xl border border-white/10 bg-white/[0.02] p-2.5">
                        <div className="text-lg mb-1">🏘</div>
                        <div className="text-[10px] text-slate-400">Population</div>
                        <div className="font-bold text-slate-200">{selectedHotspot.population_dist_km || 2.1} km</div>
                      </div>
                      <div className="rounded-xl border border-white/10 bg-white/[0.02] p-2.5">
                        <div className="text-lg mb-1">🛣</div>
                        <div className="text-[10px] text-slate-400">Highway</div>
                        <div className="font-bold text-slate-200">{selectedHotspot.highway_dist_km || 0.4} km</div>
                      </div>
                    </div>
                  </div>

                  {/* Explainable AI (XAI) */}
                  <div className="mt-5 rounded-xl border border-cyan-500/30 bg-cyan-500/5 p-4 flex-1">
                    <div className="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                      <i data-lucide="brain" className="w-4 h-4"></i>
                      Why did AI classify this?
                    </div>
                    <ul className="space-y-1.5 text-xs text-slate-200">
                      {(selectedHotspot.xai_reasons || [
                        "✓ Hotspot located 0.6 km from refinery complex",
                        "✓ FRP significantly above baseline threshold",
                        "✓ 4 consecutive spatial satellite passes",
                        "✓ Sudden thermal intensity escalation"
                      ]).map((r, i) => (
                        <li key={i} className="flex items-start gap-1.5">
                          <span className="text-cyan-400 font-bold">{r}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Action Buttons */}
                  <div className="mt-6 flex flex-col gap-2">
                    <button 
                      onClick={() => setShowSatModal(true)}
                      className="w-full rounded-xl border border-cyan-500/40 bg-cyan-500/10 py-2.5 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20 transition-all flex items-center justify-center gap-2">
                      <i data-lucide="image" className="w-4 h-4"></i>
                      VIEW SATELLITE IMAGE
                    </button>
                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={() => setShowTimelineModal(true)}
                        className="rounded-xl border border-white/10 bg-white/[0.04] py-2 text-xs font-bold text-slate-200 hover:bg-white/10 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="clock" className="w-3.5 h-3.5"></i>
                        TIMELINE
                      </button>
                      <button 
                        onClick={() => setShowReportModal(true)}
                        className="rounded-xl border border-rose-500/40 bg-rose-500/10 py-2 text-xs font-bold text-rose-300 hover:bg-rose-500/20 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                        REPORT
                      </button>
                    </div>
                  </div>
                </aside>
              ) : (
                <div className="glass-panel flex items-center justify-center rounded-2xl p-8 text-center text-slate-400">
                  Select an incident from the map or queue.
                </div>
              )}
            </section>
          )}

          {/* TAB 2: NATIONAL INDUSTRIAL RISK MAP */}
          {activeTab === 'national' && (
            <section className="glass-panel rounded-2xl p-6">
              <div className="border-b border-white/10 pb-4 mb-6">
                <h2 className="text-xl font-bold text-white">National Industrial Digital Risk Map</h2>
                <p className="text-xs text-slate-400">Pre-analyzed state-wide industrial thermal risk aggregation across key Indian industrial corridors.</p>
              </div>

              <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {nationalRisk.map((st, i) => (
                  <div key={i} className="rounded-2xl border border-white/10 bg-white/[0.02] p-5 hover:border-rose-500/40 transition-all">
                    <div className="flex items-center justify-between">
                      <h3 className="text-lg font-bold text-white">{st.state}</h3>
                      <span className={`px-3 py-1 rounded-full text-xs font-extrabold bg-${st.color}-500/20 text-${st.color}-300 border border-${st.color}-500/40`}>
                        {st.level} ({st.risk_score}/100)
                      </span>
                    </div>

                    <div className="mt-4 grid grid-cols-2 gap-3 text-xs">
                      <div><span className="text-slate-400">Industrial Facilities:</span> <strong className="text-slate-200">{st.facilities}</strong></div>
                      <div><span className="text-slate-400">Thermal Sources:</span> <strong className="text-slate-200">{st.thermal_sources}</strong></div>
                      <div><span className="text-slate-400">Active Anomalies:</span> <strong className="text-amber-400 font-bold">{st.active_anomalies}</strong></div>
                      <div><span className="text-slate-400">High Risk Incidents:</span> <strong className="text-rose-400 font-bold">{st.high_risk}</strong></div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* MODAL 1: SATELLITE IMAGE VERIFICATION */}
          {showSatModal && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="glass-panel max-w-xl w-full rounded-2xl p-6 border border-cyan-500/40">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-white text-base flex items-center gap-2">
                    <i data-lucide="eye" className="w-5 h-5 text-cyan-400"></i>
                    Optical & Infrared Satellite Imagery Verification
                  </h3>
                  <button onClick={() => setShowSatModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="mt-4 relative rounded-xl overflow-hidden border border-white/10 bg-slate-950 min-h-[250px]">
                  <img 
                    src="https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=700&q=80" 
                    alt="Satellite Imagery" 
                    className="w-full h-64 object-cover opacity-80"
                  />
                  <div className="absolute inset-0 border-2 border-dashed border-rose-500/60 m-8 rounded-lg pointer-events-none"></div>
                  <div className="absolute top-10 left-10 bg-rose-500/90 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
                    AI Computer Vision: Industrial Infrastructure Core (94.2%)
                  </div>
                </div>

                <div className="mt-4 text-xs text-slate-300 leading-relaxed">
                  Computer vision model confirmed industrial storage tanks and refinery flare stack structure within 0.8 km of satellite thermal anomaly core.
                </div>

                <div className="mt-5 flex justify-end">
                  <button onClick={() => setShowSatModal(false)} className="px-4 py-2 bg-cyan-500 text-black text-xs font-bold rounded-xl">Close Preview</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: INCIDENT TIMELINE */}
          {showTimelineModal && selectedHotspot && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="glass-panel max-w-lg w-full rounded-2xl p-6 border border-rose-500/40">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-white text-base">5-Day Incident Thermal Timeline</h3>
                  <button onClick={() => setShowTimelineModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="mt-4 space-y-3">
                  {(selectedHotspot.incident_timeline || [
                    { day: "Aug 25", status: "Normal Baseline", frp: 12, level: "LOW" },
                    { day: "Aug 26", status: "Thermal Anomaly Detected", frp: 45, level: "MODERATE" },
                    { day: "Aug 27", status: "Persistent Source Identified", frp: 85, level: "MODERATE" },
                    { day: "Aug 28", status: "High FRP Intensity Surge", frp: 120, level: "HIGH" },
                    { day: "Aug 29", status: "Critical Industrial Fire Incident", frp: 156, level: "CRITICAL" }
                  ]).map((t, i) => (
                    <div key={i} className="flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.02] p-3 text-xs">
                      <div>
                        <div className="font-bold text-slate-200">{t.day} — {t.status}</div>
                        <div className="text-slate-400">FRP Output: {t.frp} MW</div>
                      </div>
                      <span className="px-2.5 py-1 rounded-md text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">
                        {t.level}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="mt-5 flex justify-end">
                  <button onClick={() => setShowTimelineModal(false)} className="px-4 py-2 bg-rose-500 text-white text-xs font-bold rounded-xl">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: GENERATE REPORT */}
          {showReportModal && selectedHotspot && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="glass-panel max-w-xl w-full rounded-2xl p-6 border border-white/20">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-white text-base">THERMALGUARD AI — Incident Intelligence Report</h3>
                  <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="mt-4 p-4 rounded-xl border border-white/10 bg-black/40 font-mono text-xs space-y-2 text-slate-300">
                  <div>==================================================</div>
                  <div className="text-rose-400 font-bold">THERMALGUARD AI EMERGENCY INCIDENT ASSESSMENT REPORT</div>
                  <div>==================================================</div>
                  <div>Incident ID: SAT-10042</div>
                  <div>Timestamp: 2026-08-31T13:50:00Z</div>
                  <div>Location: {selectedHotspot.nearest_facility_name || 'Jamnagar, Gujarat'} ({selectedHotspot.latitude}°N, {selectedHotspot.longitude}°E)</div>
                  <div>Classification: {selectedHotspot.predicted_category}</div>
                  <div>AI Confidence: {selectedHotspot.confidence_score}%</div>
                  <div>AI Risk Score: {selectedHotspot.risk_score || 91}/100 [CRITICAL]</div>
                  <div>FRP Intensity: {selectedHotspot.frp} MW</div>
                  <div>OSM Infrastructure: Refinery 0.8 km | Residential 2.1 km</div>
                  <div>==================================================</div>
                  <div>EXPLAINABLE AI EVIDENCE:</div>
                  {(selectedHotspot.xai_reasons || []).map((r, i) => <div key={i}>{r}</div>)}
                </div>

                <div className="mt-5 flex justify-end gap-2">
                  <button onClick={() => alert("Report downloaded successfully as PDF.")} className="px-4 py-2 bg-rose-500 text-white text-xs font-bold rounded-xl">Download PDF</button>
                  <button onClick={() => setShowReportModal(false)} className="px-4 py-2 bg-slate-700 text-white text-xs font-bold rounded-xl">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: EMERGENCY ALERT SYSTEM */}
          {showAlertModal && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="glass-panel max-w-md w-full rounded-2xl p-6 border border-amber-500/40">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-amber-300 text-base flex items-center gap-2">
                    <i data-lucide="bell" className="w-5 h-5"></i>
                    Automatic Emergency Alert System
                  </h3>
                  <button onClick={() => setShowAlertModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="mt-4 space-y-3 text-xs text-slate-300">
                  <p>Trigger automated notification dispatch to industrial emergency authorities and plant managers.</p>
                  
                  <div className="rounded-xl border border-white/10 bg-black/40 p-3 space-y-1">
                    <div className="font-bold text-amber-400">🚨 DISPATCH SUMMARY</div>
                    <div>SMS Alert: Dispatched to +91-9876543210</div>
                    <div>Email Alert: Sent to emergency-response@gujarat.gov.in</div>
                    <div>Webhook: Pushed to National Emergency Operations Center</div>
                  </div>
                </div>

                <div className="mt-5 flex justify-end">
                  <button onClick={() => { alert("Simulated SMS & Email Emergency Alerts sent!"); setShowAlertModal(false); }} className="px-4 py-2 bg-amber-500 text-black text-xs font-bold rounded-xl">Send Test Alert</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: API & BACKEND SETTINGS */}
          {showConfigModal && (
            <div className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="glass-panel max-w-lg w-full rounded-2xl p-6 border border-cyan-500/40">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-bold text-cyan-300 text-base flex items-center gap-2">
                    <i data-lucide="settings" className="w-5 h-5"></i>
                    Backend API Configuration & Status
                  </h3>
                  <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="mt-4 space-y-4 text-xs text-slate-300">
                  <div className="rounded-xl border border-white/10 bg-black/40 p-4 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-slate-200">NASA FIRMS API Mode:</span>
                      <span className={`px-2.5 py-0.5 rounded-full font-extrabold ${configData && configData.firms_key_configured ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}`}>
                        {configData ? configData.firms_mode : 'SIMULATION_FALLBACK'}
                      </span>
                    </div>

                    <div className="text-slate-400">
                      NASA FIRMS Key Configured: <strong className="text-white">{configData && configData.firms_key_configured ? 'YES (Live API Active)' : 'NO (Using Simulation Engine)'}</strong>
                    </div>

                    <div className="text-slate-400">
                      SQLite Database Storage: <strong className="text-cyan-300">thermalguard.db [ONLINE]</strong>
                    </div>
                  </div>

                  <div className="rounded-xl border border-cyan-500/30 bg-cyan-500/5 p-4 space-y-2">
                    <div className="font-bold text-cyan-300 flex items-center gap-1.5">
                      <i data-lucide="key" className="w-4 h-4"></i>
                      How to add your NASA FIRMS MAP_KEY:
                    </div>
                    <ol className="list-decimal list-inside space-y-1 text-slate-300 leading-relaxed">
                      <td>Get a free key from <a href="https://firms.modaps.eosdis.nasa.gov/api/map_key/" target="_blank" className="text-cyan-400 underline">NASA FIRMS API</a></td>
                      <td>Open <code className="bg-black/50 px-1 py-0.5 rounded text-rose-300">d:\abc\.env</code> in VS Code or Notepad</td>
                      <td>Set <code className="bg-black/50 px-1 py-0.5 rounded text-emerald-300">NASA_FIRMS_MAP_KEY=your_key_here</code></td>
                      <td>Restart backend server (<code className="bg-black/50 px-1 py-0.5 rounded text-white">python main.py</code>)</td>
                    </ol>
                  </div>
                </div>

                <div className="mt-5 flex justify-end gap-2">
                  <button onClick={async () => {
                    await fetch('/api/sync-firms');
                    await fetchData();
                    alert("Triggered FIRMS API sync!");
                  }} className="px-4 py-2 bg-cyan-500 text-black text-xs font-bold rounded-xl">Sync FIRMS Data</button>
                  <button onClick={() => setShowConfigModal(false)} className="px-4 py-2 bg-slate-700 text-white text-xs font-bold rounded-xl">Close</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    setTimeout(() => lucide.createIcons(), 200);
  </script>
</body>
</html>
